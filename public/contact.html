<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | PBCC Library</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" type="image/png" href="img/pbcc-favicon.png">
</head>
<body>

    <header class="navbar">
        <div class="navbar-content">
            <div class="logo-section">
                <img src="img/pbcc-seal.png" alt="Pangantucan Bukidnon Community College seal" class="logo">
                <span class="university-name">
                    PANGANTUCAN BUKIDNON<br>COMMUNITY COLLEGE
                </span>
            </div>
            <button type="button" class="nav-menu-toggle" id="navMenuToggle" aria-expanded="false" aria-controls="primaryNav" aria-label="Open menu">
                <span class="nav-menu-toggle-bar" aria-hidden="true"></span>
                <span class="nav-menu-toggle-bar" aria-hidden="true"></span>
                <span class="nav-menu-toggle-bar" aria-hidden="true"></span>
            </button>
            <nav class="nav-links" id="primaryNav">
                <a href="/">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="/opac">OPAC</a>
                <a href="contact.html">CONTACT US</a>
                <a href="/rooms/book">ROOM RESERVATIONS</a>
                <a href="/feedback" class="feedback-link">FEEDBACK</a>
                <a href="/login" class="login-button">LOGIN</a>
            </nav>
        </div>
    </header>

    <section class="contact-section reveal">
        <h2>CONTACT US</h2>
        <div class="glass-card">
            <div class="contact-item">
                <div class="icon">📍</div>
                <h4>ADDRESS</h4>
                <p>Pangantucan, Bukidnon</p>
                <p>Philippines</p>
            </div>
            <div class="contact-item">
                <div class="icon">📘</div>
                <h4>FACEBOOK</h4>
                <p><a href="https://www.facebook.com/pangbukcc/">facebook.com/pangbukcc</a></p>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="img/pbcc-seal.png" alt="PBCC seal" class="footer-logo">
            <h2 class="footer-university-name">PANGANTUCAN BUKIDNON COMMUNITY COLLEGE</h2>
            <p class="footer-tagline">Pangantucan, Bukidnon</p>
            <p class="footer-tagline"><a href="https://www.facebook.com/pangbukcc/">facebook.com/pangbukcc</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="about.js"></script>
</body>
</html>
